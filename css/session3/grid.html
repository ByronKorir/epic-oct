<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Grid Mastery</title>
<link rel="stylesheet" href="grid.css">
</head>
<body>
    <h1>CSS Grid Layout</h1>
    <section>
        <h2>Basic Grid - 3 columns</h2>
        <div class="grid basic-grid">
            <div class="grid-item">1</div>
            <div class="grid-item">2</div>
            <div class="grid-item">3</div>
            <div class="grid-item">4</div>
            <div class="grid-item">5</div>
            <div class="grid-item">6</div>
        </div>
    </section>
    <section>
        <h2>Grid with fr units</h2>
        <div class="grid fr-grid">
            <div class="grid-item">1fr</div>
            <div class="grid-item">2fr</div>
            <div class="grid-item">1fr</div>
        </div>
    </section>
    <section>
        <h2>Grid with specific column/row placement</h2>
        <div class="grid placement-grid">
            <div class="grid-item header">Header</div>
            <div class="grid-item sidebar">Sidebar</div>
            <div class="grid-item main">Main Content</div>
            <div class="grid-item footer">Footer</div>
        </div>
    </section>
<section>
<h2>Grid Template Areas (Magazine Layout)</h2>
<div class="grid magazine-layout">
<header class="grid-area-header">Header</header>
<nav class="grid-area-nav">Navigation</nav>
<main class="grid-area-main">Main Content</main>
<aside class="grid-area-sidebar">Sidebar</aside>
<footer class="grid-area-footer">Footer</footer>
</div>
</section>
</body>
</html>
